[project]
name = "todo"
version = "0.01"
description = "A python command line todo application"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
	"alembic>=1.14.0",
	"plotext>=5.3.2",
	"pytest>=8.3.4",
	"pyyaml>=6.0.2",
	"sqlalchemy>=2.0.36",
	"termcharts>=1.1.2",
	"typer>=0.15.1",
]

[tool.ruff]
select = ["E", "F", "I"]

[tool.ruff.isort]
known-first-party = [] # List of first-party modules, if applicable
known-third-party = [] # List of third-party modules, if applicable
