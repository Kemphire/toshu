{% extends 'base.html' %}
{% block content %}
    <h1 class="text-center mb-4">Your Tasks</h1>
    {% for task in tasks %}
        <!-- Task List -->
        <div class="task-card">
            <h3>{{ task.title }}</h3>
            <p>{{ task.description }}</p>
            <button class="btn btn-custom">Mark as Done</button>
            <button class="btn btn-danger delete-task">Delete</button>
        </div>
    {% endfor %}
    <div class="text-center mt-4">
        <a href="#" class="btn btn-custom">Add New Task</a>
    </div>
{% endblock %}
